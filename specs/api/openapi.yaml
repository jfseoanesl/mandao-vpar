openapi: 3.0.3
info:
  title: Mandao API (MVP)
  version: 0.1.0
  description: |
    Contrato HTTP de Mandao — "Lo que tengas que hacer, lo hacemos por ti".
    Fuente de verdad (SDD, principio P2). `ApiContractTest` falla si el backend expone
    o deja de exponer una operación distinta a las declaradas aquí.

    Autenticación: `Authorization: Bearer <accessToken>` (JWT HS256, 15 min).
    El refresh token viaja en la cookie HttpOnly `mandao_rt` (ruta `/api/auth`).
    Errores: RFC 7807 (`application/problem+json`) con `detail` en español.
    Montos en pesos colombianos (COP) enteros. Fechas ISO-8601 UTC.
servers:
  - url: http://localhost:8080
tags:
  - name: auth
  - name: public
  - name: errands
    description: Cliente (specs 002, 003, 005, 008)
  - name: courier
    description: Mandadero (specs 004, 005, 006, 009)
  - name: company
    description: Mandao Empresas (spec 011)
  - name: admin
    description: Operación del piloto (spec 010)
security:
  - bearer: []

paths:
  # ---------------------------------------------------------------- auth (001)
  /api/auth/register:
    post:
      tags: [auth]
      security: []
      summary: Registro de cliente o mandadero (AC-001-01..03)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: Sesión creada, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/auth/login:
    post:
      tags: [auth]
      security: []
      summary: Inicio de sesión (AC-001-04, AC-001-05)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/auth/refresh:
    post:
      tags: [auth]
      security: []
      summary: Rota el refresh token de la cookie (AC-001-06)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /api/auth/logout:
    post:
      tags: [auth]
      security: []
      summary: Cierra la sesión (AC-001-07)
      responses:
        '204': { description: Sesión cerrada }
  /api/me:
    get:
      tags: [auth]
      summary: Usuario actual
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserView' } } } }
  /api/me/password:
    put:
      tags: [auth]
      summary: Cambia mi contraseña; cierra las demás sesiones y emite una nueva (AC-001-10)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties: { currentPassword: { type: string }, newPassword: { type: string, description: 'Mínimo 8, con letras y números' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '400': { description: Contraseña actual incorrecta o nueva inválida }
  /api/me/terms:
    post:
      tags: [auth]
      summary: Acepta la versión vigente de los términos y condiciones; devuelve una sesión nueva (AC-001-14)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: string, example: '1.0' } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '409': { description: La versión enviada no es la vigente }
  /api/me/addresses:
    get:
      tags: [company]
      summary: Direcciones frecuentes de mi empresa (AC-011-05)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AddressView' } } } } }

  # ---------------------------------------------------------------- push (spec 012)
  /api/push/key:
    get:
      tags: [push]
      summary: Llave pública VAPID para suscribirse (AC-012-01)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { publicKey: { type: string } } } } } }
  /api/push/subscriptions:
    post:
      tags: [push]
      summary: Registra la suscripción Web Push de este dispositivo (AC-012-02)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PushSubscription' } } } }
      responses:
        '204': { description: Registrada }
    delete:
      tags: [push]
      summary: Elimina la suscripción de este dispositivo (AC-012-02)
      parameters: [ { name: endpoint, in: query, required: true, schema: { type: string } } ]
      responses:
        '204': { description: Eliminada }

  # ---------------------------------------------------------------- public
  /api/public/config:
    get:
      tags: [public]
      security: []
      summary: Configuración pública (WhatsApp, área de servicio)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PublicConfig' } } } }
  /api/events:
    post:
      tags: [public]
      security: []
      summary: Evento de embudo desde el navegador (lista blanca)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventRequest' }
      responses:
        '202': { description: Aceptado }

  # ---------------------------------------------------------------- cotización y mandados (002, 003, 005, 008)
  /api/quotes:
    post:
      tags: [errands]
      summary: Cotiza un mandado (AC-002-01..04, AC-002-09)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Quote' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /api/errands:
    get:
      tags: [errands]
      summary: Mis mandados
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ErrandSummary' } } } } }
    post:
      tags: [errands]
      summary: Solicita un mandado (AC-002-05..10, AC-003-01, AC-007-01)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateErrandRequest' }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/ErrandView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/errands/{id}:
    get:
      tags: [errands]
      summary: Detalle del mandado según el observador (AC-001-08)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ErrandView' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/errands/{id}/cancel:
    post:
      tags: [errands]
      summary: Cancela (AC-002-11, AC-007-06)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ErrandView' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /api/errands/{id}/confirm:
    post:
      tags: [errands]
      summary: Confirma la entrega (AC-005-08)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ErrandView' } } } }
  /api/errands/{id}/rating:
    post:
      tags: [errands]
      summary: Califica (AC-008-01, AC-008-02)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RatingRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ErrandView' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /api/errands/{id}/attachments:
    post:
      tags: [errands]
      summary: Adjunto del cliente (foto/documento)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                note: { type: string, maxLength: 1000 }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/EvidenceView' } } } }
  /api/errands/{id}/offers:
    get:
      tags: [errands]
      summary: Ofertas de un mandado negociable (AC-003-03)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OfferView' } } } } }
  /api/errands/{id}/offers/{offerId}/accept:
    post:
      tags: [errands]
      summary: Acepta una oferta (AC-003-04)
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/OfferId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ErrandView' } } } }
  /api/errands/{id}/offers/{offerId}/reject:
    post:
      tags: [errands]
      summary: Rechaza una oferta
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/OfferId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OfferView' } } } }
  /api/errands/{id}/offers/{offerId}/counter:
    post:
      tags: [errands]
      summary: Contraoferta (AC-003-05)
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/OfferId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AmountRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OfferView' } } } }
  /api/errands/{id}/track:
    get:
      tags: [errands]
      summary: Recorrido GPS del mandadero durante el servicio (spec 006)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LivePoint' } } } } }
  /api/couriers/{id}/reputation:
    get:
      tags: [errands]
      summary: Reputación de un mandadero (AC-008-03, AC-008-04)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Reputation' } } } }
  /api/files/{id}:
    get:
      tags: [errands]
      summary: Descarga una evidencia con verificación de permisos (AC-005-07)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Archivo, content: { image/jpeg: {}, image/png: {}, application/pdf: {} } }
        '404': { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- mandadero (004, 005, 006, 009)
  /api/courier/me:
    get:
      tags: [courier]
      summary: Mi perfil de mandadero (AC-009-01)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CourierView' } } } }
    put:
      tags: [courier]
      summary: Actualiza vehículo y cuenta de pago
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCourierRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CourierView' } } } }
  /api/courier/documents:
    post:
      tags: [courier]
      summary: Sube o reemplaza un documento (AC-009-02)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              properties:
                type: { $ref: '#/components/schemas/DocumentType' }
                file: { type: string, format: binary }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CourierView' } } } }
  /api/courier/availability:
    put:
      tags: [courier]
      summary: Disponible / no disponible (AC-009-01)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { available: { type: boolean } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CourierView' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /api/courier/location:
    post:
      tags: [courier]
      summary: Ping de ubicación (AC-006-01, AC-006-02)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LocationRequest' } } } }
      responses:
        '204': { description: Registrado }
        '409': { $ref: '#/components/responses/Problem' }
  /api/courier/opportunities:
    get:
      tags: [courier]
      summary: Mandados disponibles cerca (AC-004-01)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OpportunityView' } } } } }
  /api/courier/errands:
    get:
      tags: [courier]
      summary: Mis mandados como mandadero
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ErrandSummary' } } } } }
  /api/courier/errands/{id}/accept:
    post:
      tags: [courier]
      summary: Toma un mandado de precio fijo (AC-004-02..05)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ErrandView' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/courier/errands/{id}/bid:
    post:
      tags: [courier]
      summary: Oferta en un mandado negociable (AC-003-02)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AmountRequest' } } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/OfferView' } } } }
  /api/courier/errands/{id}/accept-counter:
    post:
      tags: [courier]
      summary: Acepta la contraoferta del cliente (AC-003-05)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ErrandView' } } } }
  /api/courier/errands/{id}/on-the-way:
    post:
      tags: [courier]
      summary: Voy en camino (AC-005-01)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ErrandView' } } } }
  /api/courier/errands/{id}/start:
    post:
      tags: [courier]
      summary: Inicia con el código del cliente (AC-005-02, AC-005-03)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OtpRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ErrandView' } } } }
        '422': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
  /api/courier/errands/{id}/deliver:
    post:
      tags: [courier]
      summary: Entrega con el código de fin (AC-005-04)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OtpRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ErrandView' } } } }
        '422': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
  /api/courier/errands/{id}/fail:
    post:
      tags: [courier]
      summary: Reporta que no se pudo completar
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ErrandView' } } } }
  /api/courier/errands/{id}/evidences:
    post:
      tags: [courier]
      summary: Agrega evidencia (AC-005-05, AC-005-06, AC-007-02)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [FOTO, FACTURA, FIRMA, NOTA] }
                file: { type: string, format: binary }
                note: { type: string, maxLength: 1000 }
                amount: { type: integer, format: int64, description: Valor de la factura (FACTURA) }
                lat: { type: number }
                lng: { type: number }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/EvidenceView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/courier/earnings:
    get:
      tags: [courier]
      summary: Ganancias (AC-007-05)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Earnings' } } } }

  # ---------------------------------------------------------------- empresa (011)
  /api/company:
    get:
      tags: [company]
      summary: Mi empresa
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CompanyView' } } } }
  /api/company/members:
    get:
      tags: [company]
      summary: Miembros
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UserView' } } } } }
    post:
      tags: [company]
      summary: Agrega un miembro (AC-011-02)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MemberRequest' } } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/UserView' } } } }
  /api/company/errands:
    get:
      tags: [company]
      summary: Mandados de la empresa (AC-011-04)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ErrandSummary' } } } } }
  /api/company/addresses:
    post:
      tags: [company]
      summary: Nueva dirección frecuente (AC-011-05)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressRequest' } } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/AddressView' } } } }
  /api/company/addresses/{id}:
    delete:
      tags: [company]
      summary: Elimina una dirección frecuente
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Eliminada }
  /api/company/report:
    get:
      tags: [company]
      summary: Reporte mensual CSV (AC-011-06)
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      responses:
        '200': { description: CSV, content: { text/csv: {} } }

  # ---------------------------------------------------------------- administración (009, 010, 011)
  /api/admin/kpis:
    get:
      tags: [admin]
      summary: KPIs del piloto con objetivo (AC-010-01)
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/KpiReport' } } } }
  /api/admin/errands:
    get:
      tags: [admin]
      summary: Mandados, atención primero (AC-010-02)
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ErrandStatus' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ErrandSummary' } } } } }
  /api/admin/errands/{id}/assign:
    post:
      tags: [admin]
      summary: Asignación manual (AC-004-06)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [courierId], properties: { courierId: { type: string, format: uuid } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ErrandView' } } } }
  /api/admin/errands/{id}/cancel:
    post:
      tags: [admin]
      summary: Cancela o marca fallido (AC-010-03)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ErrandView' } } } }
  /api/admin/errands/{id}/price:
    put:
      tags: [admin]
      summary: Ajusta el precio (AC-010-03)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { amount: { type: integer, format: int64, minimum: 1000 } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ErrandView' } } } }
  /api/admin/errands/{id}/resolve:
    post:
      tags: [admin]
      summary: Marca la alerta como atendida (reinicia intentos OTP)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ErrandView' } } } }
  /api/admin/errands/{id}/courier-paid:
    post:
      tags: [admin]
      summary: Registra el pago al mandadero (AC-007-05)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ErrandView' } } } }
  /api/admin/export/errands:
    get:
      tags: [admin]
      summary: Exporta mandados a CSV (AC-010-04)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: CSV, content: { text/csv: {} } }
  /api/admin/payments:
    get:
      tags: [admin]
      summary: Pagos (AC-007-04)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, CONFIRMED, VOIDED] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PaymentView' } } } } }
  /api/admin/payments/{id}/confirm:
    post:
      tags: [admin]
      summary: Confirma un pago manual (AC-007-04)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { reference: { type: string, maxLength: 80 } } } } } }
      responses:
        '200': { description: OK }
        '409': { $ref: '#/components/responses/Problem' }
  /api/admin/couriers:
    get:
      tags: [admin]
      summary: Mandaderos por estado de verificación
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, APPROVED, REJECTED] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CourierView' } } } } }
  /api/admin/couriers/{id}/approve:
    post:
      tags: [admin]
      summary: Aprueba (AC-009-03)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CourierView' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /api/admin/couriers/{id}/reject:
    post:
      tags: [admin]
      summary: Rechaza con motivo (AC-009-04)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CourierView' } } } }
  /api/admin/documents/{id}:
    get:
      tags: [admin]
      summary: Documento de identidad (solo admin, AC-009-05)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Archivo, content: { image/jpeg: {}, image/png: {}, application/pdf: {} } }
  /api/admin/live:
    get:
      tags: [admin]
      summary: Mapa en vivo (AC-010-06)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LiveMap' } } } }
  /api/admin/tariff:
    get:
      tags: [admin]
      summary: Tarifa vigente
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Tariff' } } } }
    put:
      tags: [admin]
      summary: Crea una nueva versión de tarifa (AC-010-05)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TariffRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Tariff' } } } }
  /api/admin/companies:
    get:
      tags: [admin]
      summary: Empresas
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CompanyView' } } } } }
    post:
      tags: [admin]
      summary: Crea empresa y su administrador (AC-011-01)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateCompanyRequest' } } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/CompanyView' } } } }
  /api/admin/users:
    get:
      tags: [admin]
      summary: Últimos 200 usuarios
      responses:
        '200': { description: OK }
  /api/admin/users/{id}/active:
    post:
      tags: [admin]
      summary: Activa / desactiva un usuario (revoca sesiones)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { active: { type: boolean } } } } } }
      responses:
        '200': { description: OK }
  /api/admin/users/{id}/reset-password:
    post:
      tags: [admin]
      summary: Genera una contraseña temporal de un solo uso; el usuario debe cambiarla al entrar (AC-001-11)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: La contraseña temporal se muestra una sola vez
          content: { application/json: { schema: { type: object, properties: { temporaryPassword: { type: string } } } } }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    OfferId: { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Problem:
      description: Error RFC 7807
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              status: { type: integer }
              title: { type: string }
              detail: { type: string }
              errors: { type: object, additionalProperties: { type: string } }
  schemas:
    Role: { type: string, enum: [CLIENT, COURIER, ADMIN, COMPANY_ADMIN] }
    ErrandCategory: { type: string, enum: [ENVIO, COMPRA, DILIGENCIA, BUSCAR_COMPRAR, RECOGER_ENTREGAR, EMPRESARIAL, OTRO] }
    Complexity: { type: string, enum: [SENCILLA, MEDIA, COMPLEJA] }
    PricingMode: { type: string, enum: [FIXED, NEGOTIABLE] }
    PaymentMethod: { type: string, enum: [EFECTIVO, NEQUI, DAVIPLATA, TRANSFERENCIA] }
    ErrandStatus: { type: string, enum: [NEGOTIATING, SEARCHING, ASSIGNED, GOING_TO_ORIGIN, IN_PROGRESS, DELIVERED, COMPLETED, RATED, CANCELLED, FAILED] }
    DocumentType: { type: string, enum: [CEDULA_FRENTE, CEDULA_REVERSO, SELFIE, SOAT, LICENCIA, TARJETA_PROPIEDAD] }
    GeoPoint:
      type: object
      required: [lat, lng]
      properties: { lat: { type: number }, lng: { type: number } }
    RegisterRequest:
      type: object
      required: [fullName, phone, password, role, acceptPrivacy]
      properties:
        fullName: { type: string, minLength: 3, maxLength: 120 }
        phone: { type: string, pattern: '^3\d{9}$' }
        email: { type: string, format: email }
        password: { type: string, pattern: '^(?=.*[A-Za-z])(?=.*\d).{8,72}$' }
        role: { type: string, enum: [CLIENT, COURIER] }
        acceptPrivacy: { type: boolean, description: Debe ser true (Ley 1581) }
        utmSource: { type: string, maxLength: 60 }
    LoginRequest:
      type: object
      required: [phone, password]
      properties: { phone: { type: string }, password: { type: string } }
    UserView:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        phone: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        companyId: { type: string, format: uuid }
        mustChangePassword: { type: boolean, description: 'true tras un restablecimiento por el admin' }
        termsPending: { type: boolean, description: 'true si debe aceptar la versión vigente de los términos (AC-001-13)' }
    PushSubscription:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri }
        keys:
          type: object
          required: [p256dh, auth]
          properties: { p256dh: { type: string }, auth: { type: string } }
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: segundos }
        user: { $ref: '#/components/schemas/UserView' }
    PublicConfig:
      type: object
      properties: { whatsapp: { type: string }, centerLat: { type: number }, centerLng: { type: number }, radiusKm: { type: number } }
    EventRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, enum: [landing_view, whatsapp_click, signup_started, install_prompt, category_selected] }
        props: { type: string, maxLength: 300 }
        utmSource: { type: string, maxLength: 60 }
    QuoteRequest:
      type: object
      required: [complexity, stops]
      properties:
        complexity: { $ref: '#/components/schemas/Complexity' }
        stops: { type: array, minItems: 1, maxItems: 6, items: { $ref: '#/components/schemas/GeoPoint' } }
        estimatedWaitMinutes: { type: integer, minimum: 0, maximum: 240 }
    Quote:
      type: object
      properties:
        distanceKm: { type: number }
        base: { type: integer }
        distance: { type: integer }
        waitCharge: { type: integer }
        extraStops: { type: integer }
        complexity: { type: integer }
        total: { type: integer }
        platformFee: { type: integer }
        courierPayout: { type: integer }
        tariffVersion: { type: integer }
    StopRequest:
      type: object
      required: [address, lat, lng]
      properties:
        address: { type: string, maxLength: 250 }
        lat: { type: number }
        lng: { type: number }
        instructions: { type: string, maxLength: 500 }
        contactName: { type: string, maxLength: 120 }
        contactPhone: { type: string, pattern: '^$|^3\d{9}$' }
    CreateErrandRequest:
      type: object
      required: [category, description, complexity, pricingMode, stops, paymentMethod]
      properties:
        category: { $ref: '#/components/schemas/ErrandCategory' }
        description: { type: string, minLength: 5, maxLength: 2000 }
        complexity: { $ref: '#/components/schemas/Complexity' }
        pricingMode: { $ref: '#/components/schemas/PricingMode' }
        stops: { type: array, minItems: 1, maxItems: 6, items: { $ref: '#/components/schemas/StopRequest' } }
        estimatedWaitMinutes: { type: integer, minimum: 0, maximum: 240 }
        purchaseBudget: { type: integer, minimum: 0, maximum: 2000000, description: Bolsa de compras (solo COMPRA / BUSCAR_COMPRAR) }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        scheduledFor: { type: string, format: date-time }
        repeatOf: { type: string, format: uuid }
    ReasonRequest:
      type: object
      properties: { reason: { type: string, maxLength: 300 } }
    OtpRequest:
      type: object
      required: [otp]
      properties: { otp: { type: string, pattern: '^\d{4}$' } }
    AmountRequest:
      type: object
      required: [amount]
      properties:
        amount: { type: integer, minimum: 3000, maximum: 500000 }
        message: { type: string, maxLength: 300 }
    RatingRequest:
      type: object
      required: [stars]
      properties:
        stars: { type: integer, minimum: 1, maximum: 5 }
        tags: { type: array, maxItems: 5, items: { type: string, enum: [CUIDADOSO, RAPIDO, AMABLE, BUENA_COMUNICACION, EXCELENTE_DILIGENCIAS] } }
        comment: { type: string, maxLength: 500 }
    Reputation:
      type: object
      properties:
        averageStars: { type: number }
        ratingsCount: { type: integer }
        completedCount: { type: integer }
        completionRate: { type: number, description: porcentaje }
        punctualityRate: { type: number, description: porcentaje }
        memberSince: { type: string, format: date-time }
        tags: { type: object, additionalProperties: { type: integer } }
    CourierSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        phone: { type: string, description: Solo al quedar asignado }
        vehicleType: { type: string }
        plate: { type: string }
        reputation: { $ref: '#/components/schemas/Reputation' }
    EvidenceView:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [FOTO, FACTURA, FIRMA, NOTA, ADJUNTO] }
        note: { type: string }
        amount: { type: integer }
        lat: { type: number }
        lng: { type: number }
        contentType: { type: string }
        hasFile: { type: boolean }
        createdAt: { type: string, format: date-time }
    ErrandSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        category: { $ref: '#/components/schemas/ErrandCategory' }
        description: { type: string }
        status: { $ref: '#/components/schemas/ErrandStatus' }
        pricingMode: { $ref: '#/components/schemas/PricingMode' }
        totalPrice: { type: integer }
        courierPayout: { type: integer }
        createdAt: { type: string, format: date-time }
        firstAddress: { type: string }
        lastAddress: { type: string }
        clientName: { type: string }
        courierName: { type: string }
        needsAttention: { type: boolean }
        attentionReason: { type: string }
    ErrandView:
      type: object
      description: |
        Vista según el observador (`viewer`): OWNER ve los códigos OTP; PROSPECT (mandadero evaluando)
        no ve contactos, historial ni evidencias; ADMIN ve alertas e intentos OTP.
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        category: { $ref: '#/components/schemas/ErrandCategory' }
        description: { type: string }
        complexity: { $ref: '#/components/schemas/Complexity' }
        pricingMode: { $ref: '#/components/schemas/PricingMode' }
        status: { $ref: '#/components/schemas/ErrandStatus' }
        stops: { type: array, items: { $ref: '#/components/schemas/StopRequest' } }
        distanceKm: { type: number }
        quotedPrice: { type: integer }
        totalPrice: { type: integer }
        platformFee: { type: integer }
        courierPayout: { type: integer }
        purchaseBudget: { type: integer }
        purchasesTotal: { type: integer }
        refundTotal: { type: integer }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        paymentStatus: { type: string, enum: [PENDING, CONFIRMED, VOIDED] }
        startOtp: { type: string }
        endOtp: { type: string }
        courier: { $ref: '#/components/schemas/CourierSummary' }
        evidences: { type: array, items: { $ref: '#/components/schemas/EvidenceView' } }
        courierLocation: { $ref: '#/components/schemas/LivePoint' }
        viewer: { type: string, enum: [OWNER, COMPANY_ADMIN, COURIER, PROSPECT, ADMIN] }
    OfferView:
      type: object
      properties:
        id: { type: string, format: uuid }
        errandId: { type: string, format: uuid }
        courier: { $ref: '#/components/schemas/CourierSummary' }
        amount: { type: integer }
        counterAmount: { type: integer }
        message: { type: string }
        status: { type: string, enum: [PENDING, COUNTERED, ACCEPTED, REJECTED] }
    OpportunityView:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        category: { $ref: '#/components/schemas/ErrandCategory' }
        pricingMode: { $ref: '#/components/schemas/PricingMode' }
        courierPayout: { type: integer }
        suggestedPrice: { type: integer }
        distanceToOriginKm: { type: number }
        myOffer: { $ref: '#/components/schemas/OfferView' }
    LivePoint:
      type: object
      properties: { lat: { type: number }, lng: { type: number }, at: { type: string, format: date-time } }
    LocationRequest:
      type: object
      required: [lat, lng]
      properties: { lat: { type: number }, lng: { type: number }, accuracy: { type: number } }
    UpdateCourierRequest:
      type: object
      required: [vehicleType, payoutMethod, payoutAccount]
      properties:
        vehicleType: { type: string, enum: [A_PIE, BICICLETA, MOTO, CARRO] }
        plate: { type: string }
        payoutMethod: { type: string, enum: [NEQUI, DAVIPLATA, BANCO] }
        payoutAccount: { type: string }
    CourierView:
      type: object
      properties:
        userId: { type: string, format: uuid }
        fullName: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        rejectionReason: { type: string }
        available: { type: boolean }
        missingDocuments: { type: array, items: { $ref: '#/components/schemas/DocumentType' } }
    Earnings:
      type: object
      properties:
        today: { type: integer }
        week: { type: integer }
        pendingPayout: { type: integer }
        paidTotal: { type: integer }
        completedCount: { type: integer }
    CompanyView:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        nit: { type: string }
        plan: { type: string, enum: [BASICO, PYME, EMPRESAS, PRO] }
        monthlyFee: { type: integer }
        members: { type: integer }
    CreateCompanyRequest:
      type: object
      required: [name, plan, adminFullName, adminPhone, adminPassword]
      properties:
        name: { type: string }
        nit: { type: string }
        plan: { type: string, enum: [BASICO, PYME, EMPRESAS, PRO] }
        adminFullName: { type: string }
        adminPhone: { type: string }
        adminPassword: { type: string }
    MemberRequest:
      type: object
      required: [fullName, phone, password]
      properties: { fullName: { type: string }, phone: { type: string }, password: { type: string } }
    AddressRequest:
      type: object
      required: [label, address, lat, lng]
      properties: { label: { type: string }, address: { type: string }, lat: { type: number }, lng: { type: number } }
    AddressView:
      type: object
      properties: { id: { type: string, format: uuid }, label: { type: string }, address: { type: string }, lat: { type: number }, lng: { type: number } }
    PaymentView:
      type: object
      properties:
        id: { type: string, format: uuid }
        errandId: { type: string, format: uuid }
        errandCode: { type: string }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        amount: { type: integer }
        status: { type: string, enum: [PENDING, CONFIRMED, VOIDED] }
        purchases: { type: integer }
        refund: { type: integer }
        courierPayout: { type: integer }
        courierPaidAt: { type: string, format: date-time }
    Kpi:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: number, nullable: true }
        target: { type: number }
        unit: { type: string }
        higherIsBetter: { type: boolean }
        met: { type: boolean, nullable: true }
    KpiReport:
      type: object
      properties:
        days: { type: integer }
        kpis: { type: array, items: { $ref: '#/components/schemas/Kpi' } }
        totals: { type: object }
        funnel: { type: object, properties: { quotes: { type: integer }, requested: { type: integer }, completed: { type: integer } } }
        daily: { type: array, items: { type: object } }
        byCategory: { type: array, items: { type: object } }
        bySegment: { type: array, items: { type: object } }
        byChannel: { type: array, items: { type: object } }
    LiveMap:
      type: object
      properties:
        couriers: { type: array, items: { type: object } }
        errands: { type: array, items: { type: object } }
    Tariff:
      type: object
      properties:
        version: { type: integer }
        baseFare: { type: integer }
        perKm: { type: integer }
        includedWaitMin: { type: integer }
        perExtraMin: { type: integer }
        perExtraStop: { type: integer }
        complexityMedium: { type: integer }
        complexityComplex: { type: integer }
        commissionPct: { type: number }
    TariffRequest:
      allOf: [ { $ref: '#/components/schemas/Tariff' } ]
