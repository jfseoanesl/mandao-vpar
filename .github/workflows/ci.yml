name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unitarias + integración + contrato OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      # Testcontainers levanta PostGIS real con el Docker del runner.
      - run: mvn -B verify
        working-directory: backend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    name: Frontend (build PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx ng build --configuration production
        working-directory: frontend

  e2e:
    name: E2E (stack completo con Docker Compose + Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Secretos efímeros de CI
        working-directory: infra
        run: |
          cp .env.example .env
          sed -i "s/^SEED_DEMO=.*/SEED_DEMO=true/" .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^OTP_KEY=.*/OTP_KEY=$(openssl rand -hex 24)/" .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$(openssl rand -hex 16)/" .env
          # Sin salida a OSRM: la distancia usa el respaldo haversine.
          echo "ROUTING_ENABLED=false" >> .env
      - run: docker compose up -d --build --wait
        working-directory: infra
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env: { BASE_URL: 'http://localhost:8088' }
      - if: failure()
        run: docker compose logs --no-color backend | tail -200
        working-directory: infra
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: frontend/playwright-report }

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dependency-check/Dependency-Check_Action@main
        with:
          project: mandao
          path: '.'
          format: HTML
          args: --failOnCVSS 9 --exclude "**/node_modules/**"
      - uses: actions/upload-artifact@v4
        with: { name: dependency-check-report, path: reports }
