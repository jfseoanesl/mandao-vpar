# Mandao · stack completo del piloto.
#   cp .env.example .env   (y cambia los secretos)
#   docker compose up -d --build
# Abre http://localhost:8088 (o https://TU_DOMINIO en producción).
name: mandao

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mandao
      POSTGRES_USER: mandao
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandao -d mandao"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Sin puertos publicados: solo el backend llega a la base de datos.

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/mandao
      DB_USER: mandao
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      OTP_KEY: ${OTP_KEY:?Define OTP_KEY en .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Orígenes permitidos (API y WebSocket), separados por coma. Por defecto, PUBLIC_URL.
      CORS_ORIGINS: ${CORS_ORIGINS:-${PUBLIC_URL:-http://localhost:8088}}
      # Evidencias y documentos en un volumen privado (suficiente para el piloto).
      # Para AWS S3: STORAGE_TYPE=s3 + S3_ENDPOINT/S3_ACCESS_KEY/S3_SECRET_KEY/S3_BUCKET.
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-mandao-files}
      ROUTING_ENABLED: ${ROUTING_ENABLED:-true}
      # Notificaciones push (spec 012). Genera las llaves una vez: ver README.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:soporte@mandao.co}
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-573000000000}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      TZ: UTC
    volumes:
      - files:/data/files

  web:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Solo red local (ver frontend/Caddyfile); vacías en producción.
      CADDY_DEFAULT_SNI: ${CADDY_DEFAULT_SNI:-}
      CADDY_AUTO_HTTPS: ${CADDY_AUTO_HTTPS:-}
      BACKEND: backend:8080
    ports:
      - "${HTTP_PORT:-8088}:80"
      - "${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  files:
  caddy-data:
  caddy-config:
